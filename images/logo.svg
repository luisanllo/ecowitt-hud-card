<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="45%" stop-color="#e0722c"/>
      <stop offset="100%" stop-color="#2c3e63"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7ad"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- sun peeking from top-left, echoes the card's day/night sun bar -->
  <circle cx="30" cy="32" r="16" fill="url(#sunGlow)"/>
  <g stroke="#ffe7ad" stroke-width="2.4" stroke-linecap="round">
    <line x1="30" y1="8" x2="30" y2="2"/>
    <line x1="30" y1="56" x2="30" y2="62"/>
    <line x1="6" y1="32" x2="0" y2="32"/>
    <line x1="54" y1="32" x2="60" y2="32"/>
    <line x1="13" y1="15" x2="9" y2="11"/>
    <line x1="47" y1="49" x2="51" y2="53"/>
    <line x1="13" y1="49" x2="9" y2="53"/>
    <line x1="47" y1="15" x2="51" y2="11"/>
  </g>

  <!-- instrument dial, echoes the wind compass in the card -->
  <circle cx="76" cy="80" r="40" fill="rgba(15,20,30,0.28)"/>
  <circle cx="76" cy="80" r="40" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
  <circle cx="76" cy="80" r="31" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.45"/>
  <g transform="translate(76,80) rotate(-35)">
    <path d="M0,-27 L9,10 L0,2 L-9,10 Z" fill="#ffffff"/>
  </g>
  <circle cx="76" cy="80" r="4.5" fill="#ffffff"/>
</svg>
